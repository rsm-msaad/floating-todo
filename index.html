<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Checklist</title>
<style>
  :root {
    --bg: rgba(22, 22, 26, 0.94);
    --stroke: rgba(255, 255, 255, 0.10);
    --hairline: rgba(255, 255, 255, 0.07);
    --text: #ECECEF;
    --muted: #83838E;
    --faint: #5E5E68;
    --accent: #7EE0B0;
    --urgent: #F0736A;
    --soon:   #E8A54B;
    --later:  #7B94C4;
    --hover: rgba(255, 255, 255, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    cursor: default;
    user-select: none;
  }

  .panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    overflow: hidden;
  }

  /* Header, also the drag handle */
  header {
    -webkit-app-region: drag;
    flex: 0 0 auto;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--hairline);
  }

  .title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .count {
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    margin-right: auto;
  }

  .controls { display: flex; gap: 2px; -webkit-app-region: no-drag; }

  .icon-btn {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 0; border-radius: 6px;
    background: transparent;
    color: var(--faint);
    cursor: default;
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .icon-btn svg { width: 13px; height: 13px; }

  .body { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }

  /* Composer */
  .composer { flex: 0 0 auto; padding: 10px 14px; border-top: 1px solid var(--hairline); }
  #new {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 2px 0;
    outline: none;
    user-select: text;
  }
  #new::placeholder { color: var(--faint); }

  /* List */
  ul { flex: 1 1 auto; list-style: none; overflow-y: auto; padding: 8px 6px 6px 8px; }
  ul::-webkit-scrollbar { width: 8px; }
  ul::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
  ul::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.20); background-clip: content-box; }

  li {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 9px;
    padding: 6px 4px 6px 6px;
    border-left: 2px solid transparent;
    border-radius: 7px;
    animation: rise 180ms cubic-bezier(.2,.8,.3,1);
    transition: background 160ms ease, border-color 160ms ease;
  }
  li:hover { background: var(--hover); }
  li.pri-urgent { background: rgba(240,115,106,0.13); border-left-color: var(--urgent); }
  li.pri-urgent:hover { background: rgba(240,115,106,0.18); }
  li.pri-soon   { background: rgba(232,165,75,0.13); border-left-color: var(--soon); }
  li.pri-soon:hover   { background: rgba(232,165,75,0.18); }
  li.pri-later  { background: rgba(123,148,196,0.13); border-left-color: var(--later); }
  li.pri-later:hover  { background: rgba(123,148,196,0.18); }
  li.done.pri-urgent { background: rgba(240,115,106,0.06); }
  li.done.pri-soon   { background: rgba(232,165,75,0.06); }
  li.done.pri-later  { background: rgba(123,148,196,0.06); }
  @keyframes rise { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .box {
    flex: 0 0 auto;
    margin-top: 1px;
    width: 15px; height: 15px;
    border: 1.5px solid rgba(255,255,255,0.28);
    border-radius: 5px;
    background: transparent;
    display: grid; place-items: center;
    cursor: default;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .box:hover { border-color: rgba(255,255,255,0.5); }
  .box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .box svg { width: 9px; height: 9px; color: #14161A; opacity: 0; transform: scale(0.6); transition: opacity 140ms ease, transform 160ms cubic-bezier(.2,1.4,.4,1); }
  li.done .box { background: var(--accent); border-color: var(--accent); }
  li.done .box svg { opacity: 1; transform: scale(1); }

  .label {
    position: relative;
    flex: 1 1 auto;
    font-size: 13px;
    line-height: 1.35;
    word-break: break-word;
    cursor: default;
    transition: color 220ms ease;
  }
  .label::after {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    height: 1px; width: 0;
    background: currentColor;
    transition: width 260ms cubic-bezier(.4,0,.2,1);
  }
  li.done .label { color: var(--faint); }
  li.done .label::after { width: 100%; }

  .has-notes-marker {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--faint);
    margin-left: 5px;
    vertical-align: middle;
  }

  .notes-wrap {
    flex-basis: 100%;
    margin-left: 24px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 180ms ease, opacity 180ms ease;
  }
  .notes-wrap.open {
    opacity: 1;
  }

  .notes-wrap textarea {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    line-height: 1.4;
    padding: 4px 0 2px;
    resize: none;
    outline: none;
    overflow: hidden;
    user-select: text;
  }
  .notes-wrap textarea::placeholder { color: var(--faint); }
  .notes-wrap textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .del {
    flex: 0 0 auto;
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border: 0; border-radius: 5px;
    background: transparent;
    color: var(--faint);
    opacity: 0;
    cursor: default;
    transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
  }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: #FF8A8A; background: rgba(255,120,120,0.12); }
  .del:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .del svg { width: 9px; height: 9px; }

  .empty {
    flex: 1 1 auto;
    display: grid; place-items: center;
    padding: 0 26px;
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
    color: var(--faint);
  }

  footer { flex: 0 0 auto; padding: 8px 14px; border-top: 1px solid var(--hairline); }
  #clearDone {
    border: 0; background: transparent;
    color: var(--muted);
    font: inherit; font-size: 11px;
    padding: 2px 0;
    cursor: default;
    transition: color 120ms ease;
  }
  #clearDone:hover { color: var(--text); }
  #clearDone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  [hidden] { display: none !important; }

  /* ── Edge-tuck tab ─────────────────────────────────────────── */
  .tab {
    display: none;
    position: absolute;
    inset: 0;
    border: 0;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--stroke);
    color: var(--faint);
    cursor: default;
    -webkit-app-region: no-drag;
    transition: color 120ms ease, background 120ms ease;
  }
  .tab:hover { color: var(--text); background: var(--hover); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tab svg {
    width: 10px; height: 10px;
    transition: transform 200ms ease;
  }

  body.tucked .panel { border-radius: 0; }
  body.tucked header,
  body.tucked .body { display: none; }
  body.tucked .tab { display: grid; place-items: center; }

  /* Round only the outward-facing corners */
  body.tucked.right .panel,
  body.tucked.right .tab { border-radius: 8px 0 0 8px; }
  body.tucked.left .panel,
  body.tucked.left .tab { border-radius: 0 8px 8px 0; }

  /* Chevron points away from the edge it's pinned to */
  body.tucked.left .tab svg { transform: rotate(-90deg); }
  body.tucked.right .tab svg { transform: rotate(90deg); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="panel">
    <button class="tab" id="tab" aria-label="Restore window">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5 6 8.5 10 4.5"/></svg>
    </button>
    <header>
      <span class="title">Today</span>
      <span class="count" id="count"></span>
      <div class="controls">
        <button class="icon-btn" id="quit" title="Quit" aria-label="Quit">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <ul id="list"></ul>
      <p class="empty" id="empty">Nothing here yet.<br />Type below to add your first task.</p>
      <div class="composer">
        <input id="new" type="text" placeholder="Add a task" autocomplete="off" spellcheck="false" />
      </div>
      <footer id="footer" hidden>
        <button id="clearDone">Clear done</button>
      </footer>
    </div>
  </div>

<script>
  const KEY = 'floating-todo:items';
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const footer = document.getElementById('footer');
  const countEl = document.getElementById('count');
  const input = document.getElementById('new');

  let items = [];

  const save = () => window.shell.saveTasks(items);

  const icons = {
    check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.7 9 10 3.4"/></svg>',
    close: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>'
  };

  function render() {
    list.innerHTML = '';

    items.forEach((item) => {
      const li = document.createElement('li');
      li.className = item.done ? 'done' : '';

      const box = document.createElement('button');
      box.className = 'box';
      box.setAttribute('aria-label', item.done ? 'Mark as not done' : 'Mark as done');
      box.innerHTML = icons.check;
      box.addEventListener('click', () => {
        item.done = !item.done;
        li.classList.toggle('done', item.done);
        box.setAttribute('aria-label', item.done ? 'Mark as not done' : 'Mark as done');
        save();
        refreshMeta();
      });

      const label = document.createElement('span');
      label.className = 'label';
      label.setAttribute('role', 'button');
      label.setAttribute('tabindex', '0');
      label.setAttribute('aria-expanded', 'false');
      label.textContent = item.text;
      if (item.notes) {
        const marker = document.createElement('span');
        marker.className = 'has-notes-marker';
        label.appendChild(marker);
      }

      const notesWrap = document.createElement('div');
      notesWrap.className = 'notes-wrap';
      const textarea = document.createElement('textarea');
      textarea.placeholder = 'Notes';
      textarea.rows = 1;
      textarea.value = item.notes || '';
      notesWrap.appendChild(textarea);

      function autoGrow() {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
      }

      let saveTimer = null;
      textarea.addEventListener('input', () => {
        item.notes = textarea.value;
        autoGrow();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 300);
      });
      textarea.addEventListener('blur', () => {
        clearTimeout(saveTimer);
        item.notes = textarea.value;
        save();
      });
      textarea.addEventListener('click', (e) => e.stopPropagation());
      textarea.addEventListener('contextmenu', (e) => e.stopPropagation());

      function toggleNotes() {
        const opening = !notesWrap.classList.contains('open');
        if (opening) {
          notesWrap.classList.add('open');
          autoGrow();
          notesWrap.style.maxHeight = Math.max(textarea.scrollHeight + 8, 30) + 'px';
          label.setAttribute('aria-expanded', 'true');
          textarea.addEventListener('input', () => {
            notesWrap.style.maxHeight = Math.max(textarea.scrollHeight + 8, 30) + 'px';
          });
        } else {
          notesWrap.classList.remove('open');
          notesWrap.style.maxHeight = '0';
          label.setAttribute('aria-expanded', 'false');
        }
      }

      label.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleNotes();
      });
      label.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleNotes();
        }
      });

      if (item.priority) {
        li.classList.add('pri-' + item.priority);
      }

      li.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        window.shell.showTaskMenu(item.id, item.priority);
      });

      const del = document.createElement('button');
      del.className = 'del';
      del.setAttribute('aria-label', 'Delete task');
      del.innerHTML = icons.close;
      del.addEventListener('click', () => {
        items = items.filter((entry) => entry.id !== item.id);
        save();
        render();
      });

      li.append(box, label, del, notesWrap);
      list.appendChild(li);
    });

    refreshMeta();
  }

  function refreshMeta() {
    const left = items.filter((item) => !item.done).length;
    const done = items.length - left;
    countEl.textContent = items.length === 0 ? '' : left + ' left';
    empty.hidden = items.length > 0;
    list.hidden = items.length === 0;
    footer.hidden = done === 0;
  }

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      const text = input.value.trim();
      if (!text) return;
      items.push({ id: Date.now() + Math.random(), text, done: false });
      input.value = '';
      save();
      render();
      list.scrollTop = list.scrollHeight;
    }
    if (event.key === 'Escape') input.blur();
  });

  document.getElementById('clearDone').addEventListener('click', () => {
    items = items.filter((item) => !item.done);
    save();
    render();
  });

  document.getElementById('quit').addEventListener('click', () => window.shell.quit());

  document.getElementById('tab').addEventListener('click', () => window.shell.untuck());

  window.shell.onTuck(({ tucked, side }) => {
    document.body.classList.toggle('tucked', tucked);
    document.body.classList.toggle('left', tucked && side === 'left');
    document.body.classList.toggle('right', tucked && side === 'right');
  });

  window.shell.onTaskMenuChoice(({ id, action }) => {
    if (action === 'delete') {
      items = items.filter((entry) => entry.id !== id);
    } else {
      const item = items.find((entry) => entry.id === id);
      if (item) {
        item.priority = action === 'clear' ? undefined : action;
      }
    }
    save();
    render();
  });

  async function init() {
    items = await window.shell.loadTasks();

    // One-time migration from localStorage
    if (items.length === 0) {
      try {
        const old = JSON.parse(localStorage.getItem(KEY));
        if (old && old.length) {
          items = old;
          save();
          localStorage.removeItem(KEY);
        }
      } catch (err) { /* ignore */ }
    }

    render();
    input.focus();
  }

  init();
</script>
</body>
</html>
