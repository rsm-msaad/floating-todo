<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Task Detail</title>
<style>
  :root {
    --bg: rgba(22, 22, 26, 0.94);
    --stroke: rgba(255, 255, 255, 0.10);
    --hairline: rgba(255, 255, 255, 0.07);
    --text: #ECECEF;
    --muted: #83838E;
    --faint: #5E5E68;
    --accent: #7EE0B0;
    --urgent: #F0736A;
    --soon:   #E8A54B;
    --later:  #7B94C4;
    --hover: rgba(255, 255, 255, 0.06);
    --scale: 1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    cursor: default;
    user-select: none;
  }

  .panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    overflow: hidden;
  }

  header {
    -webkit-app-region: drag;
    flex: 0 0 auto;
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 10px 0 14px;
    border-bottom: 1px solid var(--hairline);
  }
  header .header-title {
    flex: 1;
    font-size: calc(11px * var(--scale));
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .controls { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .icon-btn {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 0; border-radius: 6px;
    background: transparent;
    color: var(--faint);
    cursor: default;
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .icon-btn svg { width: 13px; height: 13px; }

  .content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }

  /* ── Title ────────────────────────────────────────────────── */
  #title {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: calc(16px * var(--scale));
    font-weight: 600;
    padding: 0;
    outline: none;
    user-select: text;
  }
  #title:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 3px; }

  /* ── Row controls ─────────────────────────────────────────── */
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Done toggle */
  .done-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: calc(12px * var(--scale));
    cursor: default;
    transition: color 120ms ease;
  }
  .done-toggle:hover { color: var(--text); }
  .done-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .done-box {
    width: 14px; height: 14px;
    border: 1.5px solid rgba(255,255,255,0.28);
    border-radius: 4px;
    display: grid; place-items: center;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .done-box svg { width: 8px; height: 8px; color: #14161A; opacity: 0; transform: scale(0.6); transition: opacity 140ms ease, transform 160ms ease; }
  .done-toggle.checked .done-box { background: var(--accent); border-color: var(--accent); }
  .done-toggle.checked .done-box svg { opacity: 1; transform: scale(1); }

  /* Priority buttons */
  .pri-group {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .pri-btn {
    padding: 3px 8px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: calc(10px * var(--scale));
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: default;
    transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
  }
  .pri-btn:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
  .pri-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pri-btn.active.urgent { background: rgba(240,115,106,0.2); border-color: var(--urgent); color: var(--urgent); }
  .pri-btn.active.soon   { background: rgba(232,165,75,0.2);  border-color: var(--soon);   color: var(--soon); }
  .pri-btn.active.later  { background: rgba(123,148,196,0.2); border-color: var(--later);  color: var(--later); }

  /* ── Notes ────────────────────────────────────────────────── */
  .section-label {
    font-size: calc(10px * var(--scale));
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }

  #notes {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: calc(13px * var(--scale));
    line-height: 1.5;
    padding: 0;
    resize: none;
    outline: none;
    overflow: hidden;
    user-select: text;
  }
  #notes:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 3px; }

  .notes-display {
    color: var(--muted);
    font: inherit;
    font-size: calc(13px * var(--scale));
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
    user-select: text;
    min-height: 1.5em;
  }
  .notes-display a {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
  }
  .notes-display a:hover { text-decoration: underline; }

  /* ── Subtasks ───────────────────────────────────────────── */
  .st-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .st-track {
    flex: 1 1 auto;
    height: 3px;
    background: var(--hairline);
    border-radius: 2px;
    overflow: hidden;
  }
  .st-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 260ms ease;
  }
  .st-count {
    flex: 0 0 auto;
    font-size: calc(10px * var(--scale));
    font-variant-numeric: tabular-nums;
    color: var(--faint);
  }

  .st-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .st-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 4px 4px 2px;
    border-radius: 5px;
    transition: background 120ms ease;
  }
  .st-row:hover { background: var(--hover); }

  .st-box {
    flex: 0 0 auto;
    margin-top: 2px;
    width: 13px; height: 13px;
    border: 1.5px solid rgba(255,255,255,0.28);
    border-radius: 4px;
    background: transparent;
    display: grid; place-items: center;
    cursor: default;
    transition: background 160ms ease, border-color 160ms ease;
  }
  .st-box:hover { border-color: rgba(255,255,255,0.5); }
  .st-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .st-box svg { width: 8px; height: 8px; color: #14161A; opacity: 0; transform: scale(0.6); transition: opacity 140ms ease, transform 160ms cubic-bezier(.2,1.4,.4,1); }
  .st-row.done .st-box { background: var(--accent); border-color: var(--accent); }
  .st-row.done .st-box svg { opacity: 1; transform: scale(1); }

  .st-text {
    position: relative;
    flex: 1 1 auto;
    font-size: calc(12px * var(--scale));
    line-height: 1.4;
    color: var(--text);
    word-break: break-word;
    cursor: text;
    transition: color 220ms ease;
  }
  .st-text::after {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    height: 1px; width: 0;
    background: currentColor;
    transition: width 260ms cubic-bezier(.4,0,.2,1);
  }
  .st-row.done .st-text { color: var(--faint); }
  .st-row.done .st-text::after { width: 100%; }

  .st-edit {
    flex: 1 1 auto;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: calc(12px * var(--scale));
    line-height: 1.4;
    padding: 0;
    outline: none;
    user-select: text;
  }
  .st-edit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .st-del {
    flex: 0 0 auto;
    width: 16px; height: 16px;
    display: grid; place-items: center;
    border: 0; border-radius: 4px;
    background: transparent;
    color: var(--faint);
    opacity: 0;
    cursor: default;
    transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
  }
  .st-row:hover .st-del { opacity: 1; }
  .st-del:hover { color: #FF8A8A; background: rgba(255,120,120,0.12); }
  .st-del:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; opacity: 1; }
  .st-del svg { width: 8px; height: 8px; }

  .st-input {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: calc(12px * var(--scale));
    padding: 4px 0;
    outline: none;
    user-select: text;
  }
  .st-input::placeholder { color: var(--faint); }
  .st-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  /* ── Attachments ──────────────────────────────────────────── */
  .att-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .att-header .section-label { flex: 1; }

  .att-add {
    border: 0;
    background: transparent;
    color: var(--faint);
    font: inherit;
    font-size: calc(11px * var(--scale));
    cursor: default;
    transition: color 120ms ease;
  }
  .att-add:hover { color: var(--text); }
  .att-add:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .att-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .att-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 6px;
    border-radius: 5px;
    font-size: calc(12px * var(--scale));
    color: var(--muted);
    transition: background 120ms ease;
  }
  .att-item:hover { background: var(--hover); }
  .att-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 5px; }
  .att-item.missing { opacity: 0.4; }

  .att-icon {
    flex: 0 0 auto;
    width: 14px; height: 14px;
    color: var(--faint);
  }

  .att-name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: default;
  }

  .att-remove {
    flex: 0 0 auto;
    width: 16px; height: 16px;
    display: grid; place-items: center;
    border: 0; border-radius: 4px;
    background: transparent;
    color: var(--faint);
    opacity: 0;
    cursor: default;
    transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
  }
  .att-item:hover .att-remove { opacity: 1; }
  .att-remove:hover { color: #FF8A8A; background: rgba(255,120,120,0.12); }
  .att-remove:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; opacity: 1; }
  .att-remove svg { width: 8px; height: 8px; }

  /* ── Drop zone ────────────────────────────────────────────── */
  .att-section {
    border: 1px dashed transparent;
    border-radius: 8px;
    padding: 6px;
    transition: border-color 140ms ease;
  }
  .drop-active .att-section {
    border-color: var(--accent);
  }

  .drop-hint {
    display: none;
    text-align: center;
    font-size: calc(11px * var(--scale));
    color: var(--accent);
    padding: 6px 0 2px;
  }
  .drop-active .drop-hint { display: block; }

  /* ── Subtask children & per-subtask attachments ─────────── */
  .st-row-child {
    margin-left: 20px;
  }
  .st-row-child .st-text {
    font-size: calc(12px * var(--scale));
    color: var(--muted);
  }
  .st-row-child.done .st-text { color: var(--faint); }

  .st-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
  }

  .st-child-count {
    font-size: calc(10px * var(--scale));
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    cursor: default;
    transition: color 120ms ease;
  }
  .st-child-count:hover { color: var(--text); }

  .st-clip {
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: calc(10px * var(--scale));
    font-variant-numeric: tabular-nums;
    color: var(--faint);
    cursor: default;
    transition: color 120ms ease;
  }
  .st-clip:hover { color: var(--text); }
  .st-clip svg { width: 10px; height: 10px; }

  .st-add-child {
    flex: 0 0 auto;
    width: 16px; height: 16px;
    display: grid; place-items: center;
    border: 0; border-radius: 4px;
    background: transparent;
    color: var(--faint);
    opacity: 0;
    cursor: default;
    font-size: 13px;
    line-height: 1;
    transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
  }
  .st-row:hover > .st-add-child { opacity: 1; }
  .st-add-child:hover { color: var(--text); background: var(--hover); }
  .st-add-child:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; opacity: 1; }

  .st-child-input {
    margin-left: 20px;
    width: calc(100% - 20px);
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: calc(12px * var(--scale));
    padding: 4px 0;
    outline: none;
    user-select: text;
  }
  .st-child-input::placeholder { color: var(--faint); }
  .st-child-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .st-row.drop-target {
    border: 1px dashed var(--accent);
  }

  .st-att-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .st-att-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px 2px 22px;
    border-radius: 4px;
    font-size: calc(11px * var(--scale));
    color: var(--muted);
    transition: background 120ms ease;
  }
  .st-att-item.child-att { padding-left: 42px; }
  .st-att-item:hover { background: var(--hover); }
  .st-att-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 4px; }
  .st-att-item.missing { opacity: 0.4; }
  .st-att-item .att-name {
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: default;
  }
  .st-att-item .att-remove {
    flex: 0 0 auto;
    width: 14px; height: 14px;
    display: grid; place-items: center;
    border: 0; border-radius: 3px;
    background: transparent;
    color: var(--faint);
    opacity: 0;
    cursor: default;
    transition: opacity 120ms ease, color 120ms ease, background 120ms ease;
  }
  .st-att-item:hover .att-remove { opacity: 1; }
  .st-att-item .att-remove:hover { color: #FF8A8A; background: rgba(255,120,120,0.12); }
  .st-att-item .att-remove svg { width: 7px; height: 7px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="panel">
    <header>
      <span class="header-title">Detail</span>
      <div class="controls">
        <button class="icon-btn" id="close" title="Close" aria-label="Close">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <input id="title" type="text" autocomplete="off" spellcheck="false" />

      <div class="row">
        <button class="done-toggle" id="doneBtn" aria-label="Toggle done">
          <span class="done-box">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.7 9 10 3.4"/></svg>
          </span>
          <span class="done-label">Done</span>
        </button>
        <div class="pri-group">
          <button class="pri-btn urgent" data-pri="urgent">Urgent</button>
          <button class="pri-btn soon"   data-pri="soon">Soon</button>
          <button class="pri-btn later"  data-pri="later">Later</button>
        </div>
      </div>

      <div id="notesSection">
        <span class="section-label">Notes</span>
        <textarea id="notes" rows="1"></textarea>
        <div class="notes-display" id="notesDisplay" hidden></div>
      </div>

      <div>
        <span class="section-label">Subtasks</span>
        <div class="st-progress" id="stProgress" hidden>
          <div class="st-track"><div class="st-fill" id="stFill"></div></div>
          <span class="st-count" id="stCount"></span>
        </div>
        <ul class="st-list" id="stList"></ul>
        <input class="st-input" id="stInput" type="text" placeholder="Add a subtask" autocomplete="off" spellcheck="false" />
      </div>

      <div class="att-section">
        <div class="att-header">
          <span class="section-label">Attachments</span>
          <button class="att-add" id="addFiles">+ Add files</button>
        </div>
        <ul class="att-list" id="attList"></ul>
        <p class="drop-hint">Drop to attach</p>
      </div>
    </div>
  </div>

<script>
  let task = null;
  let saveTimer = null;

  const titleEl = document.getElementById('title');
  const notesEl = document.getElementById('notes');
  const doneBtn = document.getElementById('doneBtn');
  const attList = document.getElementById('attList');
  const priBtns = document.querySelectorAll('.pri-btn');

  const closeIcon = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 2.5 9.5 9.5M9.5 2.5 2.5 9.5"/></svg>';
  const fileIcon = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1H3.5A1.5 1.5 0 0 0 2 2.5v9A1.5 1.5 0 0 0 3.5 13h7a1.5 1.5 0 0 0 1.5-1.5V5L8 1Z"/><path d="M8 1v4h4"/></svg>';
  const notesDisplay = document.getElementById('notesDisplay');
  const stList = document.getElementById('stList');
  const stProgress = document.getElementById('stProgress');
  const stFill = document.getElementById('stFill');
  const stCount = document.getElementById('stCount');
  const stInput = document.getElementById('stInput');
  const checkSvg = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.7 9 10 3.4"/></svg>';

  const URL_RE = /(https?:\/\/[^\s<]+|mailto:[^\s<]+|message:\/\/[^\s<]+)/gi;
  const TRAIL_PUNCT = /[.,;:)\]]+$/;

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(commitSave, 300);
  }

  function commitSave() {
    clearTimeout(saveTimer);
    if (!task) return;
    window.shell.updateTask({ ...task });
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function linkify(text) {
    const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return escaped.replace(URL_RE, (raw) => {
      const decoded = raw.replace(/&amp;/g, '&');
      const trailing = decoded.match(TRAIL_PUNCT);
      const url = trailing ? decoded.slice(0, -trailing[0].length) : decoded;
      const suffix = trailing ? raw.slice(raw.length - trailing[0].length) : '';
      return '<a href="#" data-url="' + url.replace(/"/g, '&quot;') + '">' +
             raw.slice(0, raw.length - suffix.length) + '</a>' + suffix;
    });
  }

  function showNotesDisplay() {
    const text = task.notes || '';
    if (!text.trim()) {
      notesDisplay.hidden = true;
      notesEl.hidden = false;
      return;
    }
    notesDisplay.innerHTML = linkify(text);
    notesDisplay.hidden = false;
    notesEl.hidden = true;
  }

  function showNotesEditor() {
    notesDisplay.hidden = true;
    notesEl.hidden = false;
    notesEl.value = task.notes || '';
    autoGrow(notesEl);
    notesEl.focus();
  }

  // Collapsed state (default = expanded). Persisted in settings.
  const collapsedChildren = new Set();
  const collapsedClips = new Set();
  let addingChildTo = null;

  // Quick Look state
  let qlActive = false;
  let hoveredAttFile = null; // { taskId, file } of currently hovered att row

  function isChildOpen(id) { return !collapsedChildren.has(id); }
  function isClipOpen(id) { return !collapsedClips.has(id); }

  function toggleCollapsed(set, id) {
    if (set.has(id)) set.delete(id);
    else set.add(id);
    saveCollapsed();
  }

  function saveCollapsed() {
    window.shell.setSettings({
      collapsed: {
        children: [...collapsedChildren],
        clips: [...collapsedClips]
      }
    });
  }

  function loadCollapsed(s) {
    collapsedChildren.clear();
    collapsedClips.clear();
    if (s && s.collapsed) {
      if (s.collapsed.children) s.collapsed.children.forEach((id) => collapsedChildren.add(id));
      if (s.collapsed.clips) s.collapsed.clips.forEach((id) => collapsedClips.add(id));
    }
  }

  const clipSvg = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 6.4 6.5 10.1a2.1 2.1 0 0 1-3 0 2.1 2.1 0 0 1 0-3l4.6-4.6a1.4 1.4 0 0 1 2 0 1.4 1.4 0 0 1 0 2L5.5 9.1a.7.7 0 0 1-1 0 .7.7 0 0 1 0-1l3.7-3.7"/></svg>';

  function loadTask(t) {
    task = {
      ...t,
      attachments: t.attachments ? [...t.attachments] : [],
      subtasks: t.subtasks ? t.subtasks.map((s) => ({
        ...s,
        children: s.children ? s.children.map((c) => ({ ...c })) : [],
        attachments: s.attachments ? [...s.attachments] : []
      })) : []
    };

    titleEl.value = task.text;
    notesEl.value = task.notes || '';
    autoGrow(notesEl);
    showNotesDisplay();

    doneBtn.classList.toggle('checked', !!task.done);
    priBtns.forEach((b) => b.classList.toggle('active', task.priority === b.dataset.pri));

    renderSubtasks();
    renderAttachments();
  }

  async function renderAttachments() {
    attList.innerHTML = '';
    for (const att of task.attachments) {
      const li = document.createElement('li');
      let exists = false;
      if (att.file) {
        const info = await window.shell.resolveAttachment(task.id, att.file);
        exists = info.exists;
      }
      li.className = 'att-item' + (exists ? '' : ' missing');
      li.setAttribute('tabindex', '0');
      if (att.file) {
        li.dataset.attTaskId = task.id;
        li.dataset.attFile = att.file;
      }

      li.addEventListener('mouseenter', () => {
        if (att.file) hoveredAttFile = { taskId: task.id, file: att.file };
      });
      li.addEventListener('mouseleave', () => {
        if (hoveredAttFile && hoveredAttFile.file === att.file) hoveredAttFile = null;
      });

      const icon = document.createElement('span');
      icon.className = 'att-icon';
      icon.innerHTML = fileIcon;

      const name = document.createElement('span');
      name.className = 'att-name';
      name.textContent = att.name;
      name.title = att.file || '';

      li.addEventListener('click', () => {
        if (exists) window.shell.openAttachment(task.id, att.file);
      });
      li.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        if (exists) window.shell.revealAttachment(task.id, att.file);
      });

      const rm = document.createElement('button');
      rm.className = 'att-remove';
      rm.setAttribute('aria-label', 'Remove attachment');
      rm.innerHTML = closeIcon;
      rm.addEventListener('click', (e) => {
        e.stopPropagation();
        if (att.file) window.shell.removeFile(task.id, att.file);
        task.attachments = task.attachments.filter((a) => a !== att);
        commitSave();
        renderAttachments();
      });

      li.append(icon, name, rm);
      attList.appendChild(li);
    }
  }

  // ── Title ──

  titleEl.addEventListener('input', () => {
    task.text = titleEl.value;
    scheduleSave();
  });
  titleEl.addEventListener('blur', commitSave);

  // ── Notes ──

  notesEl.addEventListener('input', () => {
    task.notes = notesEl.value;
    autoGrow(notesEl);
    scheduleSave();
  });
  notesEl.addEventListener('blur', () => {
    commitSave();
    showNotesDisplay();
  });

  notesDisplay.addEventListener('click', (e) => {
    const link = e.target.closest('a[data-url]');
    if (link) {
      e.preventDefault();
      window.shell.openExternal(link.dataset.url);
      return;
    }
    showNotesEditor();
  });

  // ── Done toggle ──

  doneBtn.addEventListener('click', () => {
    task.done = !task.done;
    doneBtn.classList.toggle('checked', task.done);
    commitSave();
  });

  // ── Priority ──

  priBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.pri;
      task.priority = task.priority === p ? undefined : p;
      priBtns.forEach((b) => b.classList.toggle('active', task.priority === b.dataset.pri));
      commitSave();
    });
  });

  // ── Subtasks ──

  function setupRowDrop(rowEl, target) {
    rowEl.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
      rowEl.classList.add('drop-target');
    });
    rowEl.addEventListener('dragleave', (e) => {
      e.stopPropagation();
      rowEl.classList.remove('drop-target');
    });
    rowEl.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      rowEl.classList.remove('drop-target');
      if (!target.attachments) target.attachments = [];
      for (const file of e.dataTransfer.files) {
        const filePath = window.shell.getPathForFile(file);
        if (!filePath) continue;
        const result = await window.shell.copyFile(task.id, filePath);
        if (result.error) continue;
        target.attachments.push(result);
      }
      commitSave();
      renderSubtasks();
    });
  }

  function renderSubtaskAttachments(container, target, isChild) {
    if (!target.attachments || target.attachments.length === 0) return;
    const ul = document.createElement('ul');
    ul.className = 'st-att-list';
    target.attachments.forEach((att) => {
      const li = document.createElement('li');
      li.className = 'st-att-item' + (isChild ? ' child-att' : '');
      li.setAttribute('tabindex', '0');
      if (att.file) {
        li.dataset.attTaskId = task.id;
        li.dataset.attFile = att.file;
      }

      li.addEventListener('mouseenter', () => {
        if (att.file) hoveredAttFile = { taskId: task.id, file: att.file };
      });
      li.addEventListener('mouseleave', () => {
        if (hoveredAttFile && hoveredAttFile.file === att.file) hoveredAttFile = null;
      });

      if (att.file) {
        window.shell.resolveAttachment(task.id, att.file).then((info) => {
          if (!info.exists) li.classList.add('missing');
        });
      } else {
        li.classList.add('missing');
      }

      const name = document.createElement('span');
      name.className = 'att-name';
      name.textContent = att.name;
      name.title = att.file || '';

      li.addEventListener('click', () => {
        if (att.file) window.shell.openAttachment(task.id, att.file);
      });

      const rm = document.createElement('button');
      rm.className = 'att-remove';
      rm.setAttribute('aria-label', 'Remove attachment');
      rm.innerHTML = closeIcon;
      rm.addEventListener('click', (e) => {
        e.stopPropagation();
        if (att.file) window.shell.removeFile(task.id, att.file);
        target.attachments = target.attachments.filter((a) => a !== att);
        commitSave();
        renderSubtasks();
      });

      li.append(name, rm);
      ul.appendChild(li);
    });
    container.appendChild(ul);
  }

  function makeEditableText(row, sub, className) {
    const text = document.createElement('span');
    text.className = className || 'st-text';
    text.textContent = sub.text;
    text.addEventListener('click', () => {
      const input = document.createElement('input');
      input.className = 'st-edit';
      input.value = sub.text;
      row.replaceChild(input, text);
      input.focus();
      const finish = () => {
        const v = input.value.trim();
        if (v) sub.text = v;
        text.textContent = sub.text;
        row.replaceChild(text, input);
        commitSave();
      };
      input.addEventListener('blur', finish);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        if (e.key === 'Escape') { input.value = sub.text; input.blur(); }
      });
    });
    return text;
  }

  function renderSubtasks() {
    stList.innerHTML = '';
    const total = task.subtasks.length;
    const done = task.subtasks.filter((s) => s.done).length;
    stProgress.hidden = total === 0;
    if (total > 0) {
      stFill.style.width = Math.round((done / total) * 100) + '%';
      stCount.textContent = done + '/' + total;
    }

    task.subtasks.forEach((sub) => {
      if (!sub.children) sub.children = [];
      if (!sub.attachments) sub.attachments = [];

      const row = document.createElement('li');
      row.className = 'st-row' + (sub.done ? ' done' : '');

      const box = document.createElement('button');
      box.className = 'st-box';
      box.innerHTML = checkSvg;
      box.setAttribute('aria-label', sub.done ? 'Mark as not done' : 'Mark as done');
      box.addEventListener('click', () => {
        sub.done = !sub.done;
        commitSave();
        renderSubtasks();
      });

      const text = makeEditableText(row, sub);

      // Meta: child count + clip
      const meta = document.createElement('span');
      meta.className = 'st-meta';

      if (sub.attachments.length > 0) {
        const clip = document.createElement('span');
        clip.className = 'st-clip';
        clip.innerHTML = clipSvg + ' ' + sub.attachments.length;
        clip.title = sub.attachments.length + ' attachment' + (sub.attachments.length > 1 ? 's' : '');
        clip.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCollapsed(collapsedClips, sub.id);
          renderSubtasks();
        });
        meta.appendChild(clip);
      }

      if (sub.children.length > 0) {
        const childDone = sub.children.filter((c) => c.done).length;
        const cnt = document.createElement('span');
        cnt.className = 'st-child-count';
        cnt.textContent = childDone + '/' + sub.children.length;
        cnt.title = 'Toggle children';
        cnt.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCollapsed(collapsedChildren, sub.id);
          renderSubtasks();
        });
        meta.appendChild(cnt);
      }

      // Add-child button (top-level only)
      const addBtn = document.createElement('button');
      addBtn.className = 'st-add-child';
      addBtn.textContent = '+';
      addBtn.setAttribute('aria-label', 'Add child subtask');
      addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        addingChildTo = sub.id;
        collapsedChildren.delete(sub.id);
        saveCollapsed();
        renderSubtasks();
      });

      const del = document.createElement('button');
      del.className = 'st-del';
      del.setAttribute('aria-label', 'Delete subtask');
      del.innerHTML = closeIcon;
      del.addEventListener('click', () => {
        task.subtasks = task.subtasks.filter((s) => s.id !== sub.id);
        commitSave();
        renderSubtasks();
      });

      setupRowDrop(row, sub);

      row.append(box, text, meta, addBtn, del);
      stList.appendChild(row);

      // Attachment list for this subtask
      if (isClipOpen(sub.id)) {
        renderSubtaskAttachments(stList, sub, false);
      }

      // Children
      if (isChildOpen(sub.id)) {
        sub.children.forEach((child) => {
          if (!child.attachments) child.attachments = [];

          const crow = document.createElement('li');
          crow.className = 'st-row st-row-child' + (child.done ? ' done' : '');

          const cbox = document.createElement('button');
          cbox.className = 'st-box';
          cbox.innerHTML = checkSvg;
          cbox.setAttribute('aria-label', child.done ? 'Mark as not done' : 'Mark as done');
          cbox.addEventListener('click', () => {
            child.done = !child.done;
            commitSave();
            renderSubtasks();
          });

          const ctext = makeEditableText(crow, child);

          const cmeta = document.createElement('span');
          cmeta.className = 'st-meta';

          if (child.attachments.length > 0) {
            const cclip = document.createElement('span');
            cclip.className = 'st-clip';
            cclip.innerHTML = clipSvg + ' ' + child.attachments.length;
            cclip.addEventListener('click', (e) => {
              e.stopPropagation();
              toggleCollapsed(collapsedClips, child.id);
              renderSubtasks();
            });
            cmeta.appendChild(cclip);
          }

          const cdel = document.createElement('button');
          cdel.className = 'st-del';
          cdel.setAttribute('aria-label', 'Delete subtask');
          cdel.innerHTML = closeIcon;
          cdel.addEventListener('click', () => {
            sub.children = sub.children.filter((c) => c.id !== child.id);
            commitSave();
            renderSubtasks();
          });

          setupRowDrop(crow, child);

          crow.append(cbox, ctext, cmeta, cdel);
          stList.appendChild(crow);

          if (isClipOpen(child.id)) {
            renderSubtaskAttachments(stList, child, true);
          }
        });

        // Inline input for adding children
        if (addingChildTo === sub.id) {
          const inp = document.createElement('input');
          inp.className = 'st-child-input';
          inp.type = 'text';
          inp.placeholder = 'Add a subtask';
          inp.autocomplete = 'off';
          inp.spellcheck = false;
          stList.appendChild(inp);
          requestAnimationFrame(() => inp.focus());
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              const v = inp.value.trim();
              if (!v) return;
              sub.children.push({ id: Date.now() + Math.random(), text: v, done: false });
              inp.value = '';
              commitSave();
              renderSubtasks();
            }
            if (e.key === 'Escape') {
              addingChildTo = null;
              renderSubtasks();
            }
          });
          inp.addEventListener('blur', () => {
            addingChildTo = null;
            renderSubtasks();
          });
        }
      }
    });
  }

  stInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = stInput.value.trim();
      if (!text) return;
      if (!task.subtasks) task.subtasks = [];
      task.subtasks.push({ id: Date.now() + Math.random(), text, done: false });
      stInput.value = '';
      commitSave();
      renderSubtasks();
    }
  });

  // ── Add files ──

  document.getElementById('addFiles').addEventListener('click', async () => {
    const files = await window.shell.pickFiles();
    if (files.length === 0) return;
    if (!task.attachments) task.attachments = [];
    for (const f of files) {
      const result = await window.shell.copyFile(task.id, f.path);
      if (result.error) continue;
      task.attachments.push(result);
    }
    commitSave();
    renderAttachments();
  });

  // ── Drag and drop ──

  let dragCounter = 0;
  document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    document.body.classList.add('drop-active');
  });
  document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      document.body.classList.remove('drop-active');
    }
  });
  document.addEventListener('dragover', (e) => {
    e.preventDefault();
  });
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragCounter = 0;
    document.body.classList.remove('drop-active');
    if (!task) return;
    if (!task.attachments) task.attachments = [];
    for (const file of e.dataTransfer.files) {
      const filePath = window.shell.getPathForFile(file);
      if (!filePath) continue;
      const result = await window.shell.copyFile(task.id, filePath);
      if (result.error) continue;
      task.attachments.push(result);
    }
    commitSave();
    renderAttachments();
  });

  // ── Close ──

  document.getElementById('close').addEventListener('click', () => {
    commitSave();
    window.shell.closeDetail();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (qlActive) {
        window.shell.dismissQuickLook();
        qlActive = false;
        return;
      }
      commitSave();
      window.shell.closeDetail();
      return;
    }

    // Space → Quick Look on focused or hovered attachment row
    if (e.key === ' ') {
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

      // Find target: focused att row, or hovered att row
      let target = null;
      if (active && active.dataset && active.dataset.attFile) {
        target = { taskId: active.dataset.attTaskId, file: active.dataset.attFile };
      } else if (hoveredAttFile) {
        target = hoveredAttFile;
      }
      if (!target) return;

      e.preventDefault();
      if (qlActive) {
        window.shell.dismissQuickLook();
        qlActive = false;
      } else {
        window.shell.quickLook(target.taskId, target.file);
        qlActive = true;
      }
    }
  });

  // ── Settings ──

  function applyScale(s) {
    document.documentElement.style.setProperty('--scale', s);
  }

  window.shell.loadSettings().then((s) => {
    applyScale(s.fontScale);
    loadCollapsed(s);
  });
  window.shell.onSettingsChanged((s) => {
    applyScale(s.fontScale);
    loadCollapsed(s);
  });

  // ── IPC listeners ──

  window.shell.onShowTask((t) => {
    commitSave();
    loadTask(t);
  });

  window.shell.onTasksChanged((newItems) => {
    if (!task) return;
    const updated = newItems.find((i) => i.id === task.id);
    if (updated) {
      // Only reload if the data actually changed from outside
      const focused = document.activeElement;
      if (focused !== titleEl && focused !== notesEl) {
        loadTask(updated);
      } else {
        // Update non-editing fields
        task.done = updated.done;
        task.priority = updated.priority;
        task.attachments = updated.attachments ? [...updated.attachments] : [];
        task.subtasks = updated.subtasks ? updated.subtasks.map((s) => ({
          ...s,
          children: s.children ? s.children.map((c) => ({ ...c })) : [],
          attachments: s.attachments ? [...s.attachments] : []
        })) : [];
        doneBtn.classList.toggle('checked', !!task.done);
        priBtns.forEach((b) => b.classList.toggle('active', task.priority === b.dataset.pri));
        renderSubtasks();
        renderAttachments();
      }
    } else {
      // Task was deleted
      window.shell.closeDetail();
    }
  });
</script>
</body>
</html>
